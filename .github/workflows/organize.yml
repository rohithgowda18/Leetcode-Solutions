name: Auto Organize LeetCode Solutions

on:
  push:
    branches:
      - develop
    paths:
      - 'input-solutions/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Install runner dependencies
        run: npm i -g tsx --no-audit --no-fund

      - name: Run LeetCode Auto-Organizer
        run: tsx scripts/organize.ts --clean

      - name: Push Organized Solutions to main branch
        env:
          # Fallback to GitHub actor context if git log context is not available
          ACTOR_NAME: ${{ github.actor }}
          ACTOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          # 1. Determine original author name & email from the triggering commit on develop
          ORIGINAL_AUTHOR_NAME=$(git log -1 --format='%an')
          ORIGINAL_AUTHOR_EMAIL=$(git log -1 --format='%ae')

          # Fallback safely if empty
          if [ -z "$ORIGINAL_AUTHOR_NAME" ]; then
            ORIGINAL_AUTHOR_NAME="$ACTOR_NAME"
          fi
          if [ -z "$ORIGINAL_AUTHOR_EMAIL" ]; then
            ORIGINAL_AUTHOR_EMAIL="$ACTOR_EMAIL"
          fi

          # 2. Configure committer as GitHub Actions bot and author as original trigger user
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Copy generated solution folders to a temp location
          mkdir -p /tmp/organized_solutions
          if [ -d "dsa" ]; then cp -r dsa /tmp/organized_solutions/; fi
          if [ -d "database" ]; then cp -r database /tmp/organized_solutions/; fi

          # Fetch and checkout main branch
          git fetch origin main --depth=1
          git checkout -f -B main origin/main

          # Copy generated solutions into main
          mkdir -p dsa database
          if [ -d "/tmp/organized_solutions/dsa" ]; then cp -r /tmp/organized_solutions/dsa/* dsa/ 2>/dev/null || true; fi
          if [ -d "/tmp/organized_solutions/database" ]; then cp -r /tmp/organized_solutions/database/* database/ 2>/dev/null || true; fi

          git add dsa database README.md
          if git diff --staged --quiet; then
            echo "No changes to commit on main."
          else
            COMMIT_MSG="Auto-organized LeetCode solutions"
            if [ -f "/tmp/commit_msg.txt" ]; then
              COMMIT_MSG=$(cat /tmp/commit_msg.txt)
            fi
            # Commit with original author attribution preserving who uploaded the solution
            git commit \
              --author="$ORIGINAL_AUTHOR_NAME <$ORIGINAL_AUTHOR_EMAIL>" \
              -m "$COMMIT_MSG [skip ci]"
            git push origin main
          fi

          # Switch back to develop branch and remove processed input-solutions
          git checkout -f develop
          if [ -d "input-solutions" ]; then
            find input-solutions -type f ! -name ".gitkeep" -delete
          fi
          git add input-solutions/
          if git diff --staged --quiet; then
            echo "Develop input-solutions already clean."
          else
            git commit \
              --author="$ORIGINAL_AUTHOR_NAME <$ORIGINAL_AUTHOR_EMAIL>" \
              -m "Clean input-solutions after organizing [skip ci]"
            git push origin develop
          fi

