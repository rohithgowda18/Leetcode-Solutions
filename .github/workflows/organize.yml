name: Auto Organize LeetCode Solutions

on:
  push:
    branches:
      - develop
    paths:
      - 'input-solutions/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (develop branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run LeetCode Auto-Organizer
        run: npx tsx scripts/organize.ts --clean

      - name: Push Organized Solutions to main branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Temporarily copy the generated solution folders to a temp location
          mkdir -p /tmp/organized_solutions
          if [ -d "dsa" ]; then cp -r dsa /tmp/organized_solutions/; fi
          if [ -d "database" ]; then cp -r database /tmp/organized_solutions/; fi

          # Clean untracked/modified cache before switching branches
          git checkout -- . || true
          git clean -fd data/ || true

          # Switch to main branch
          git fetch origin main
          git checkout -f main

          # Copy generated solutions into main
          mkdir -p dsa database
          if [ -d "/tmp/organized_solutions/dsa" ]; then cp -r /tmp/organized_solutions/dsa/* dsa/ 2>/dev/null || true; fi
          if [ -d "/tmp/organized_solutions/database" ]; then cp -r /tmp/organized_solutions/database/* database/ 2>/dev/null || true; fi

          git add dsa database README.md
          if git diff --staged --quiet; then
            echo "No changes to commit on main."
          else
            git commit -m "Auto-organized LeetCode solutions [skip ci]"
            git push origin main
          fi

          # Switch back to develop branch and remove processed input-solutions
          git checkout -f develop
          if [ -d "input-solutions" ]; then
            find input-solutions -type f ! -name ".gitkeep" -delete
          fi
          git add input-solutions/
          if git diff --staged --quiet; then
            echo "Develop input-solutions already clean."
          else
            git commit -m "Clean input-solutions after organizing [skip ci]"
            git push origin develop
          fi

