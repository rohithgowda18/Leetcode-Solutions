name: Auto Organize LeetCode Solutions

on:
  push:
    branches:
      - develop
    paths:
      - 'input-solutions/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Install runner dependencies
        run: npm i -g tsx --no-audit --no-fund

      - name: Run LeetCode Auto-Organizer
        run: tsx scripts/organize.ts --clean

      - name: Push Organized Solutions to main branch
        env:
          TRIGGER_ACTOR: ${{ github.actor }}
          TRIGGER_ACTOR_ID: ${{ github.actor_id }}
        run: |
          # 1. Safely determine contributor attribution using GitHub-verified context
          # Prefer verified GitHub noreply email for github.actor to prevent spoofing
          ACTOR_NO_REPLY="${TRIGGER_ACTOR_ID}+${TRIGGER_ACTOR}@users.noreply.github.com"
          FALLBACK_NO_REPLY="${TRIGGER_ACTOR}@users.noreply.github.com"

          COMMIT_AUTHOR_NAME=$(git log -1 --format='%an')
          COMMIT_AUTHOR_EMAIL=$(git log -1 --format='%ae')

          # Verify if the Git author name/email matches the authenticated GitHub actor
          # If it matches the actor or is standard noreply, preserve it; otherwise use the verified actor identity
          if [ -n "$COMMIT_AUTHOR_EMAIL" ] && [[ "$COMMIT_AUTHOR_EMAIL" == *"$TRIGGER_ACTOR"* ]]; then
            AUTHOR_NAME="${COMMIT_AUTHOR_NAME:-$TRIGGER_ACTOR}"
            AUTHOR_EMAIL="$COMMIT_AUTHOR_EMAIL"
          elif [ -n "$TRIGGER_ACTOR_ID" ]; then
            AUTHOR_NAME="$TRIGGER_ACTOR"
            AUTHOR_EMAIL="$ACTOR_NO_REPLY"
          else
            AUTHOR_NAME="$TRIGGER_ACTOR"
            AUTHOR_EMAIL="$FALLBACK_NO_REPLY"
          fi

          # 2. Configure Committer identity as github-actions[bot]
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Copy generated solution folders to a temp location
          mkdir -p /tmp/organized_solutions
          if [ -d "dsa" ]; then cp -r dsa /tmp/organized_solutions/; fi
          if [ -d "database" ]; then cp -r database /tmp/organized_solutions/; fi

          # Fetch and checkout main branch
          git fetch origin main --depth=1
          git checkout -f -B main origin/main

          # Copy generated solutions into main
          mkdir -p dsa database
          if [ -d "/tmp/organized_solutions/dsa" ]; then cp -r /tmp/organized_solutions/dsa/* dsa/ 2>/dev/null || true; fi
          if [ -d "/tmp/organized_solutions/database" ]; then cp -r /tmp/organized_solutions/database/* database/ 2>/dev/null || true; fi

          git add dsa database README.md
          if git diff --staged --quiet; then
            echo "No changes to commit on main."
          else
            COMMIT_MSG="Auto-organized LeetCode solutions"
            if [ -f "/tmp/commit_msg.txt" ]; then
              COMMIT_MSG=$(cat /tmp/commit_msg.txt)
            fi
            # Commit with original author attribution preserving who uploaded the solution
            git commit \
              --author="$AUTHOR_NAME <$AUTHOR_EMAIL>" \
              -m "$COMMIT_MSG [skip ci]"
            git push origin main
          fi

          # Switch back to develop branch and remove processed input-solutions
          git checkout -f develop
          if [ -d "input-solutions" ]; then
            find input-solutions -type f ! -name ".gitkeep" -delete
          fi
          git add input-solutions/
          if git diff --staged --quiet; then
            echo "Develop input-solutions already clean."
          else
            git commit \
              --author="$AUTHOR_NAME <$AUTHOR_EMAIL>" \
              -m "Clean input-solutions after organizing [skip ci]"
            git push origin develop
          fi

