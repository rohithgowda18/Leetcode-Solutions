name: Auto Organize LeetCode Solutions

on:
  push:
    paths:
      - 'input-solutions/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run LeetCode Auto-Organizer
        run: npx tsx scripts/organize.ts --clean

      - name: Commit and Push Organized Solutions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .gitignore README.md dsa database input-solutions
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-organized LeetCode solutions [skip ci]"
            git push
          fi
